<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동준영 · Android Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;zoom:1.5}
body{
  font-family:'Noto Sans KR',sans-serif;
  color:#113047;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 34%),
    radial-gradient(circle at bottom right, rgba(127,195,236,.28), transparent 32%),
    linear-gradient(145deg, #dff3ff 0%, #bfe6fb 42%, #8ecbea 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
}
a{color:inherit;text-decoration:none}
:root{
  --sky:#2f7fb2;
  --sky-deep:#18557b;
  --sky-light:#f3fbff;
  --sky-border:rgba(24,85,123,.14);
  --dark:#113047;
}
.hero{
  width:min(100%, 620px);
  padding:54px 42px;
  border:1px solid var(--sky-border);
  border-radius:28px;
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(10px);
  box-shadow:0 28px 70px rgba(22,75,108,.16);
  text-align:center;
}
.hero-name{
  font-size:18px;
  font-weight:700;
  color:var(--sky-deep);
  letter-spacing:-.02em;
  margin-bottom:10px;
}
.hero-title{
  font-size:38px;
  line-height:1.2;
  font-weight:700;
  color:var(--dark);
  letter-spacing:-.04em;
  margin-bottom:30px;
}
.hero-links{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
.btn{
  min-width:140px;
  padding:13px 20px;
  border-radius:999px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.04em;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(21,80,114,.12);
}
.btn-primary{
  background:#ffffff;
  color:var(--sky-deep);
  border:1px solid rgba(24,85,123,.16);
}
.btn-secondary{
  background:var(--sky-deep);
  color:#fff;
  border:1px solid transparent;
}
@media(max-width:640px){
  .hero{padding:42px 24px;border-radius:22px}
  .hero-title{font-size:30px}
  .hero-links{flex-direction:column}
  .btn{width:100%}
}
</style>
</head>
<body>
<div class="hero">
  <p class="hero-name">동준영</p>
  <h1 class="hero-title">긍정의 개발자</h1>
  <div class="hero-links">
    <a href="portfolio.html#intro" class="btn btn-primary">자기소개서</a>
    <a href="portfolio.html" class="btn btn-secondary">포트폴리오</a>
  </div>
</div>
</body>
</html>
